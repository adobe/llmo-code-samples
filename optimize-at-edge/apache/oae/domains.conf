# =============================================================
# OAE Domain Enablement — one SetEnvIfExpr block per registered
# domain. Adobe LLM Optimizer issues one API key per domain.
#
# To enable Edge Optimize for a domain : uncomment its block
#                                        and fill in the API key.
# To pause  Edge Optimize for a domain : re-comment its block.
# To onboard a new domain              : copy the template at the
#                                        bottom of this file.
#
# Domains not listed (or commented out) safely route to origin.
# =============================================================

# --- www.example.com (apex + www) ---
# SetEnvIfExpr "%{HTTP_HOST} =~ m#(?i)^(www\.)?example\.com(:\d+)?$#" OAE_DOMAIN_ENABLED=1 OAE_API_KEY=YOUR_API_KEY_EXAMPLE_COM

# --- shop.example.com (subdomain) ---
# Note: a domain served from a separate VirtualHost must ALSO Include
# oae-routing.conf and oae-failover.conf in that vhost for OAE to fire.
# SetEnvIfExpr "%{HTTP_HOST} =~ m#(?i)^shop\.example\.com(:\d+)?$#" OAE_DOMAIN_ENABLED=1 OAE_API_KEY=YOUR_API_KEY_SHOP_EXAMPLE_COM

# --- Template for a new domain (copy, uncomment, and edit) ---
# SetEnvIfExpr "%{HTTP_HOST} =~ m#(?i)^(www\.)?YOUR_DOMAIN(:\d+)?$#" OAE_DOMAIN_ENABLED=1 OAE_API_KEY=YOUR_API_KEY_HERE
