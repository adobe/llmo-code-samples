# =============================================================
# OAE Routing — Include inside <VirtualHost> BEFORE rewrite rules.
# Required modules: proxy, proxy_http, ssl, rewrite, headers, env, setenvif
# =============================================================

# --- Edge Optimize endpoint ---
Define ADOBE_EO_HOST      live.edgeoptimize.net

# --- Per-domain enablement + API keys ---
# Override the path with `Define OAE_CONF_DIR /your/path` before
# this Include if your layout differs from conf/oae/.
<IfDefine !OAE_CONF_DIR>
    Define OAE_CONF_DIR conf/oae
</IfDefine>
Include "${OAE_CONF_DIR}/domains.conf"

# --- Routing decision (all 4 conditions required) ---
#   1. Host is enabled in domains.conf  (OAE_DOMAIN_ENABLED=1)
#   2. User-Agent is a known AI bot
#   3. Not a loop-back from Edge Optimize
#   4. Request is for an HTML page (not a static asset)
SetEnvIfExpr "reqenv('OAE_DOMAIN_ENABLED') == '1' && req('User-Agent') =~ /(?i)(AdobeEdgeOptimize-AI|ChatGPT-User|GPTBot|OAI-SearchBot|PerplexityBot|Perplexity-User|ClaudeBot|Claude-User|Claude-SearchBot)/ && req('x-edgeoptimize-request') == '' && %{REQUEST_URI} =~ m#(/[^./]+|\.html|/)$#" ADOBE_EDGE_OPTIMIZE=1

# Capture the original path + query string for header injection and failover replay.
SetEnvIfExpr "%{THE_REQUEST} =~ m#^[A-Z]+\s+([^\s]+)#" ADOBE_EO_ORIGINAL_TARGET=$1

# Ensure mod_cache lookup runs AFTER OAE sets request headers.
<IfModule cache_module>
    CacheQuickHandler Off
</IfModule>

# --- Proxy to Edge Optimize ---
RewriteEngine On
SSLProxyEngine On

# Intercept EO errors for failover (scoped to EO; origin errors pass through).
<Proxy "https://${ADOBE_EO_HOST}/*">
    ProxyPreserveHost Off
    ProxyErrorOverride On
    ProxyAddHeaders Off
</Proxy>

# Reserve the failover path (must come before any catch-all ProxyPass).
ProxyPass "/--adobe-eo-fallback" "!"

# --- Edge Optimize request headers (strip spoofs, then set the real ones) ---
RequestHeader unset x-forwarded-host
RequestHeader unset x-edgeoptimize-url
RequestHeader unset x-edgeoptimize-config
RequestHeader unset x-edgeoptimize-api-key
RequestHeader set x-forwarded-host "expr=%{HTTP_HOST}" env=ADOBE_EDGE_OPTIMIZE
RequestHeader set x-edgeoptimize-api-key "%{OAE_API_KEY}e" env=ADOBE_EDGE_OPTIMIZE
RequestHeader set x-edgeoptimize-config "LLMCLIENT=TRUE;" env=ADOBE_EDGE_OPTIMIZE
RequestHeader set x-edgeoptimize-url "%{ADOBE_EO_ORIGINAL_TARGET}e" env=ADOBE_EDGE_OPTIMIZE

# --- Failover ErrorDocuments (scoped to bot requests only) ---
<If "env('ADOBE_EDGE_OPTIMIZE') == '1'">
    ErrorDocument 400 /--adobe-eo-fallback
    ErrorDocument 401 /--adobe-eo-fallback
    ErrorDocument 402 /--adobe-eo-fallback
    ErrorDocument 403 /--adobe-eo-fallback
    ErrorDocument 404 /--adobe-eo-fallback
    ErrorDocument 405 /--adobe-eo-fallback
    ErrorDocument 406 /--adobe-eo-fallback
    ErrorDocument 407 /--adobe-eo-fallback
    ErrorDocument 408 /--adobe-eo-fallback
    ErrorDocument 409 /--adobe-eo-fallback
    ErrorDocument 410 /--adobe-eo-fallback
    ErrorDocument 411 /--adobe-eo-fallback
    ErrorDocument 412 /--adobe-eo-fallback
    ErrorDocument 413 /--adobe-eo-fallback
    ErrorDocument 414 /--adobe-eo-fallback
    ErrorDocument 415 /--adobe-eo-fallback
    ErrorDocument 416 /--adobe-eo-fallback
    ErrorDocument 417 /--adobe-eo-fallback
    ErrorDocument 421 /--adobe-eo-fallback
    ErrorDocument 422 /--adobe-eo-fallback
    ErrorDocument 423 /--adobe-eo-fallback
    ErrorDocument 424 /--adobe-eo-fallback
    ErrorDocument 426 /--adobe-eo-fallback
    ErrorDocument 428 /--adobe-eo-fallback
    ErrorDocument 429 /--adobe-eo-fallback
    ErrorDocument 431 /--adobe-eo-fallback
    ErrorDocument 451 /--adobe-eo-fallback
    ErrorDocument 500 /--adobe-eo-fallback
    ErrorDocument 501 /--adobe-eo-fallback
    ErrorDocument 502 /--adobe-eo-fallback
    ErrorDocument 503 /--adobe-eo-fallback
    ErrorDocument 504 /--adobe-eo-fallback
    ErrorDocument 505 /--adobe-eo-fallback
    ErrorDocument 506 /--adobe-eo-fallback
    ErrorDocument 507 /--adobe-eo-fallback
    ErrorDocument 508 /--adobe-eo-fallback
    ErrorDocument 510 /--adobe-eo-fallback
    ErrorDocument 511 /--adobe-eo-fallback
</If>


# --- Bot traffic → Edge Optimize ---
RewriteCond %{ENV:ADOBE_EDGE_OPTIMIZE} 1
RewriteCond %{REQUEST_URI} !^/--adobe-eo-fallback
RewriteRule ^(.*)$ "https://${ADOBE_EO_HOST}$1" [P,L]

# --- Response headers ---
# Drop EO's Date so mod_cache uses Apache's Date when computing freshness.
Header unset Date env=ADOBE_EDGE_OPTIMIZE

# Cache isolation: separate cache entries for bot vs human responses for OAE-enabled domains.
Header merge Vary "x-edgeoptimize-config" env=OAE_DOMAIN_ENABLED

# Failover responses: mark with x-edgeoptimize-fo:1 and force no-store.
<If "env('OAE_FAILOVER') == '1' || env('REDIRECT_OAE_FAILOVER') == '1'">
    Header always set x-edgeoptimize-fo "1"
    Header onsuccess unset Cache-Control
    Header always    unset Cache-Control
    Header onsuccess unset Expires
    Header always    unset Expires
    Header onsuccess unset Pragma
    Header always    unset Pragma
    Header always set Cache-Control "no-store"
</If>
