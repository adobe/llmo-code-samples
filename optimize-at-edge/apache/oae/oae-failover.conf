# =============================================================
# OAE Failover Handler — Include inside <VirtualHost> AFTER ProxyPass.
# Replays the original request against origin when Edge Optimize errors.
# =============================================================

<Location "/--adobe-eo-fallback">
    ProxyErrorOverride Off

    # Strip Edge Optimize headers before falling back to origin.
    RequestHeader unset x-edgeoptimize-api-key
    RequestHeader unset x-edgeoptimize-config
    RequestHeader unset x-edgeoptimize-url
    RequestHeader unset x-forwarded-host

    # Mark as failover so oae-routing.conf does NOT re-route to EO.
    RequestHeader set x-edgeoptimize-request "failover"

    RewriteEngine On

    # Non-EO errors: preserve the original status code.
    RewriteCond %{ENV:REDIRECT_ADOBE_EDGE_OPTIMIZE} !^1$
    RewriteRule .* - [R=%{ENV:REDIRECT_STATUS},L]

    # EO failover: replay the original URL against origin.
    RewriteCond %{ENV:REDIRECT_ADOBE_EO_ORIGINAL_TARGET} (.+)
    RewriteRule .* %1 [E=OAE_FAILOVER:1,PT,L,UnsafeAllow3F]

    # Last-resort fallback if the original URL is unavailable.
    RewriteRule .* / [E=OAE_FAILOVER:1,PT,L]
</Location>
